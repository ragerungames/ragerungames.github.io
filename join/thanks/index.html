<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're in! | RageRun Games</title>
<link rel="icon" href="../../favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="../../favicon-32.png">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0e1322; --panel: #141a2e; --line: #26304d; --ink: #f4f1ea; --muted: #a3abc2; --orange: #f2622e; --orange-ink: #d94e1c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: Inter, system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 72px 16px; text-align: center; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 32px; }
  h1 { font-size: 30px; margin: 0 0 10px; font-weight: 800; }
  h1 span { color: var(--orange); }
  p { color: var(--muted); line-height: 1.55; margin: 0 0 20px; }
  a.btn { display: inline-block; text-decoration: none; background: var(--orange); color: #fff; font-weight: 800; padding: 11px 18px; border-radius: 10px; }
  a.btn:hover { background: var(--orange-ink); }
</style>
</head>
<body>
<main data-rr-join-thanks>
  <div class="card">
    <h1>You're <span>in!</span></h1>
    <p>Thanks for confirming. The next RageRun newsletter lands in your inbox at the start of the month.</p>
    <a class="btn" href="https://ragerungames.com/">Browse the assets</a>
  </div>
</main>
</body>
</html>
